- id: slide-af57e5d2d5d0
  archived: false
  layout: bullets
  title: Availability
  bullets:
  - 'Availability: frequency and plausibility are judged by how easily examples come to mind'
  - Vivid, recent, or emotionally salient events feel more likely than their actual frequency warrants
  - Kahneman (2003) lists overestimates of easily recalled events among the systematic biases
  - Recent anomalies on a dashboard can shape frequency judgments more than the historical record
  speaker_notes: 'Tie this to data science: a single alarming alert can drive a frequency judgment. The
    dashboard example is an instructional application, not a finding from the Sources.'
  purpose: Why vivid or recent events feel more likely.
