- id: slide-356023302c01
  archived: false
  layout: bullets
  title: Representativeness and Conjunction
  bullets:
  - 'Representativeness: judge probability by how well an object or event resembles a class'
  - A detailed, coherent story can seem more probable than a broader category it belongs to
  - 'Conjunction error: P(A and B) judged higher than P(A), which violates the monotonicity of probability'
  - Resemblance is not likelihood; always check the base rate of the broader category
  speaker_notes: Ask students to rank a detailed scenario against the broader category it belongs to,
    then compare with the probability rules. Kahneman (2003) notes that probability judgments can violate
    monotonicity.
  purpose: Why a specific story can seem more likely than a general one.
