- id: slide-4f46653159fc
  archived: false
  layout: bullets
  title: Which Biases Matter Most
  bullets:
  - Prioritize by decision stakes, frequency, and whether a model takes a probability as input
  - Higher incentives helped most on the cognitive reflection test and little on harder tasks (Enke et
    al. 2021)
  - Base-rate neglect appeared in 35–88% of answers across Janssen et al.'s vignettes
  - Experts in sequential real-world decisions do use base rates (Link & Raab 2021)
  - Prioritize biases that a model or a process can correct, since clinicians' estimates were not fixed
    by a rule
  speaker_notes: 'Stakes alone do not remove bias: Enke et al. (2021) find very high incentives do not
    reduce most biases relative to standard incentives. The prioritization criteria on the slide are instructional.
    Use the sequential-decision evidence to argue that the severity of a bias depends on the decision
    environment.'
  purpose: Prioritizing biases for model-based decisions.
