- id: slide-3b624a9c1128
  archived: false
  layout: bullets
  title: 'Demo: Calibration Check'
  bullets:
  - Each student writes 80% intervals for ten numeric quantities, then scores how many contain the truth
  - A hit rate near 80% signals good calibration; a lower rate signals overconfidence
  - Compare group results and discuss which misses were predictable before seeing the answers
  - Calibration is trainable through feedback and repetition, not innate skill (Egan 2025)
  speaker_notes: Choose quantities students can estimate roughly but not look up in advance. Record the
    hit rate per student and for the class. Egan (2025) argues calibration can be built through habit,
    feedback, and repetition.
  purpose: Students estimate quantities and score their own calibration.
  citations:
  - source_id: source-0c230ae5775c
    label: 'Egan 2025, Stay calibrated: a practical guide to debiasing decision-making (Behavioural Insights
      Team)'
    url: null
    line_start: 11
    line_end: 21
- id: slide-6bb8e3fb1b06
  archived: false
  layout: bullets
  title: Biases in Data Work
  bullets:
  - Narrative detail can lead clinicians to trust their own judgement over a validated statistical rule
  - With or without the rule, clinicians' estimates were similar and overestimated risk (Ivanov et al.
    2000)
  - Confirmation-bias answers ranged from 11% to 51% across five vignettes (Janssen et al. 2021)
  - 'Ask: which data choices were made after seeing the outcome?'
  speaker_notes: Label leakage and cherry-picked metrics are the core data-work examples in the plan,
    but no admitted Source covers them yet; present them as instructor examples until a source is added.
    Narratives over numbers is supported by Ivanov et al. (2000), where clinicians had extra narrative
    information that the model lacked.
  purpose: Label leakage, cherry-picked metrics, and narratives over numbers.
  citations:
  - source_id: source-b2af78b9bd5e
    label: Ivanov et al. 2000, Clinicians vs. statistical model for CABG outcomes (Ann Thorac Surg)
    url: null
