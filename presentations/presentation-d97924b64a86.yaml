- id: slide-0aaac5cf33e2
  archived: false
  layout: bullets
  title: Lecture 2 Summary
  bullets:
  - Heuristics are economical and usually effective, but they produce predictable, systematic errors
  - Anchors, base rates, and availability each distort numerical judgement in a characteristic way
  - Calibration gives an outcome-focused benchmark for overconfidence
  - 'Discussion: which bias in your own modelling workflow is most likely to go unnoticed?'
  - 'Discussion: when should a statistical rule override expert judgement, and when not?'
  speaker_notes: 'Close by linking each heuristic to a measurable signature: a bias in an estimate, a
    base-rate miss, or a calibration gap. The two discussion questions set up Lecture 3.'
  purpose: Key takeaways and discussion questions.
