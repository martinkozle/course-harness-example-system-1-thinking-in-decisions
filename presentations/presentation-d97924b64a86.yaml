- id: slide-721ea4ffbf04
  archived: false
  layout: bullets
  title: Hot Hand and Pattern Seeking
  bullets:
  - 'Pattern seeking: people read streaks as signal, even in sequences generated by chance'
  - Gilovich, Vallone & Tversky (1985) studied the misperception of random sequences in basketball
  - Gigerenzer & Brighton (2009) cite this work within the heuristics literature
  - Before modelling a streak, test it against a random-sequence baseline
  - Miller & Sanjurjo (2018) revisit the hot-hand fallacy finding
  speaker_notes: Present the hot hand as a contested case, not settled fact. The Sources confirm the Gilovich
    et al. (1985) reference and list Miller & Sanjurjo (2018) in the references of Link & Raab; the reader
    should consult those papers directly before making claims about the effect size. The data-science
    takeaway (test against a random baseline before modelling) is instructional.
  purpose: Finding patterns in random data.
  citations:
  - source_id: source-54f3cd9c1f33
