- id: slide-6b5ec3ba2fcf
  archived: false
  layout: bullets
  title: Anchoring and Adjustment
  bullets:
  - 'Anchoring: an initial value, even an arbitrary one, pulls later numerical estimates toward it'
  - Adjustment away from the anchor is usually partial, so estimates stay near the starting point
  - Randomized anchors shifted vignette answers by 22 percentage points (56% vs. 34%) in surgeons (Janssen
    et al. 2021)
  - Anchoring effects in valuation tasks are mixed across studies (Enke et al. 2021)
  speaker_notes: Janssen et al. (2021) used randomized anchors and frames in a vignette study of 196 orthopaedic
    surgeons. Enke et al. (2021) report that anchoring evidence in valuation tasks is mixed, so present
    this as a robust pattern in some tasks rather than a universal law.
  purpose: How an initial value biases later estimates.
  citations:
