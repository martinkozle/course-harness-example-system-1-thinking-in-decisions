  archived: false
  layout: title
  title: Heuristics and Systematic Biases
  subtitle: Three heuristics, their characteristic errors, and how to measure them
  speaker_notes: 'Frame the lecture around one question: when do fast judgments fail in predictable ways,
    and how would we know? Lecture 1 established System 1 as useful; today we catalogue its characteristic
    errors.'
  purpose: Introduce the lecture objectives.
  citations:
  - source_id: source-ae88dbe50606
    label: 'Tversky & Kahneman 1974, Judgment under uncertainty: Heuristics and biases'
    url: null
    line_start: 12
    line_end: 12
- id: slide-daeebf98f7d7
  archived: false
  layout: bullets
  title: Judgment Under Uncertainty
  bullets:
  - 'Tversky & Kahneman (1974) named three heuristics: representativeness, availability, and anchoring
    with adjustment'
  - Heuristics are economical and usually effective, but they produce systematic, predictable errors
  - Biases are identified as departures from probability theory, Bayesian inference, or regression logic
  - 'Later reframing: people answer an easier question by substituting an attribute that comes more readily
    to mind'
  speaker_notes: The 1974 paper is the origin of the heuristics-and-biases program. Kahneman (2003) recasts
    heuristics as attribute substitution, which is useful for the Lecture 3 discussion of when System
    2 should override.
  purpose: Heuristics-and-biases program (Tversky & Kahneman, 1974).
  citations:
  - source_id: source-ae88dbe50606
    label: 'Tversky & Kahneman 1974, Judgment under uncertainty: Heuristics and biases'
