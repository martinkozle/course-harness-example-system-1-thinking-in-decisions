- id: slide-7a49dcb72dca
  archived: false
  layout: bullets
  title: Regression to the Mean
  bullets:
  - 'Regression to the mean: extreme results tend to be followed by less extreme ones'
  - Noise produces many extreme outcomes, so part of any swing is not caused by a specific action
  - Misreading regression as cause and effect over-credits praise or blame for the next result
  - Kahneman (2003) lists nonregressive prediction among the systematic biases
  speaker_notes: 'Use a simple example: a top-scoring team in one season tends to score closer to average
    the next. The causal reading is the error. The Sources identify nonregressive prediction as a bias;
    the worked illustration here is instructional.'
  purpose: Misreading noisy performance as cause and effect.
  citations:
  - source_id: source-c4bd70e31d8d
    label: Kahneman 2003, A perspective on judgment and choice
    url: null
