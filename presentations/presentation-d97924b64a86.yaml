- id: slide-3db6d451cd6f
  archived: false
  layout: bullets
  title: Base-Rate Neglect
  bullets:
  - 'Base-rate neglect: ignoring how common a condition is when judging a test result'
  - 'Example: 1% prevalence, 90% sensitivity, 9% false-positive rate gives only about 9% chance of illness
    given a positive test'
  - 'Janssen et al. (2021): 35–88% of surgeons gave base-rate-neglecting answers across three vignettes'
  - High incentives reduced complete neglect versus normal incentives, but not versus no incentives (Enke
    et al. 2021)
  - 'Link & Raab (2021): expert beach volleyball players adapted to base rates across 1,300+ games'
  speaker_notes: 'Work the Bayes example on the board: P(ill | positive) = 0.009 / (0.009 + 0.0891) ≈
    0.092. The 1%, 90%, and 9% figures are illustrative teaching numbers, not taken from a Source. Janssen
    et al. report 43%, 88%, and 35% neglect-consistent answers across their three base-rate vignettes.
    Link & Raab argue that lab tests use single questions, while real decisions are sequential, so base-rate
    use can look different in the field.'
  purpose: Worked Bayes example using a diagnostic test.
  citations:
