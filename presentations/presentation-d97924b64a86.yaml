- id: slide-925b5c13f530
  archived: false
  layout: bullets
  title: Overconfidence in Predictions
  bullets:
  - 'Calibration: stated confidence should match accuracy; 80% confidence means right about 80% of the
    time'
  - Overconfidence is common across domains, from surgery to strategy (Egan 2025)
  - 'Ivanov et al. (2000): clinicians overestimated operative mortality (7.6% vs. 6.3% model) and ICU
    stays'
  - Narrow intervals are a warning sign; widen them until coverage matches stated confidence
  speaker_notes: Ivanov et al. (2000) compared nine clinicians with a logistic regression model on 100
    CABG cases. Clinicians' estimates were similar with or without access to the predictive rule, and
    they overestimated both outcomes. Egan (2025) proposes calibration as the outcome-focused benchmark.
  purpose: Narrow intervals and inflated confidence.
  citations:
  - source_id: source-0c230ae5775c
    label: 'Egan 2025, Stay calibrated: a practical guide to debiasing decision-making (Behavioural Insights
      Team)'
