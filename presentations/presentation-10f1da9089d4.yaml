- id: slide-e740db545fd3
  archived: false
  layout: bullets
  title: When Intuition Works
  bullets:
  - Intuition is trustworthy when the environment is predictable.
  - The judge must have had a real chance to learn its regularities.
  - Subjective confidence is not a reliable indicator of judgment accuracy.
  speaker_notes: 'Kahneman and Klein reconcile the heuristics-and-biases and naturalistic decision-making
    traditions. The quality of an intuition depends on two conditions: predictability of the environment
    and opportunity to learn it.'
  purpose: Regular environments and rich feedback (Kahneman & Klein, 2009).
  citations:
  - source_id: source-2ecd078c536a
    label: Kahneman & Klein 2009, Conditions for intuitive expertise
    url: null
    line_start: null
