  layout: bullets
  title: A Judgment That Is Usually Right
  bullets:
  - The bias research is compatible with intuition as generally skilled and successful.
  - 'Ecological rationality: a heuristic succeeds when its structure fits the environment.'
  - 'Test in class: when does a fast judgment beat a slower, more thorough one?'
  speaker_notes: Kahneman's abstract states that the study of biases is compatible with a view of intuitive
    thinking as generally skilled and successful. Gigerenzer and Brighton's less-is-more results give
    the mechanism. No worked numerical example is in the admitted Sources yet; add one from the Course
    Author's material or from a Source before teaching this slide.
  purpose: Worked example of a quick judgment that performs well in practice.
