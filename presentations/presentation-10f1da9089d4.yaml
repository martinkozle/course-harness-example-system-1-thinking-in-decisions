- id: slide-de9222bec832
  archived: false
  layout: bullets
  title: Dual-Process Theory
  bullets:
  - 'System 1: fast, automatic, effortless, associative, often emotionally charged.'
  - 'System 2: slower, serial, effortful, consciously monitored and controlled.'
  - Type 2 processing supports hypothetical thinking and loads heavily on working memory.
  speaker_notes: Use Stanovich and West's labels as Kahneman summarizes them. System 1 is the intuitive
    mode; System 2 is the deliberate mode. Evans and Stanovich define the difference by hypothetical thinking
    and working-memory load.
  purpose: Define System 1 (fast, intuitive) and System 2 (slow, deliberate).
