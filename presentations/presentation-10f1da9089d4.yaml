- id: slide-2de44f0f2f38
  archived: false
  layout: bullets
  title: Lecture 1 Summary
  bullets:
  - 'Dual-process view: fast System 1 proposes; slower System 2 can test.'
  - Intuition is reliable in predictable environments with real opportunity to learn.
  - Heuristics ignore information but can be ecologically rational.
  - 'Next lecture: how the same fast processes produce systematic errors.'
  speaker_notes: 'Discussion questions: Where in your own work is a fast judgment reliable, and what would
    tell you it is not? When would a glance at a dashboard be enough, and when does it need a deliberate
    check?'
  purpose: Key takeaways and discussion questions.
