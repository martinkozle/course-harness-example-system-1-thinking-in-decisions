- id: slide-d9d69e33a79d
  archived: false
  layout: bullets
  title: Measuring System 1 in Practice
  bullets:
  - Concurrent-task interference is the most useful test of whether a process is System 1 or System 2.
  - Reaction time has long been used as a general-purpose measure of response strength.
  - Subjective confidence is not a reliable indicator of accuracy.
  speaker_notes: Kahneman identifies the concurrent-task effect as the most useful indication of System
    1 versus System 2, and notes that reaction time has been used as a general measure of response strength.
    Treat response time as an observable signal, not proof of process type. Kahneman and Klein warn that
    confidence is not a reliable guide to accuracy, which matters when reading a dashboard or a model's
    output.
  purpose: Response time, confidence, and framing as observable signals.
  citations:
