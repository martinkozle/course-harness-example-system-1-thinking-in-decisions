  title: Fast Thinking in Decisions
  subtitle: 'Lecture 1: intuition, heuristics, and the dual-process view'
  speaker_notes: 'Frame the lecture around one question: when is fast judgment good enough, and when does
    it need checking? Preview the three parts: why decisions are fast, how System 1 and System 2 divide
    the work, and when intuition is reliable.'
  purpose: Introduce the lecture and its roadmap.
