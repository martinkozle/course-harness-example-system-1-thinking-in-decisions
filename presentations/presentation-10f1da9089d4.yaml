- id: slide-b8694c1f9e16
  archived: false
  layout: bullets
  title: 'Data Science Example: Reading a Dashboard'
  bullets:
  - 'Quick reads of a dashboard are System 1 judgments: fast, automatic, and effortless.'
  - A glance surfaces the most salient number and can miss base rates and trends.
  - 'Ask: what would a slower, deliberate check need to show before acting?'
  speaker_notes: No admitted Source contains a dashboard case, so this is an instructor-built illustration
    of the System 1 characteristics from Kahneman 2003. Link and Raab show that base rates matter in real
    sequential decisions, which is the kind of information a glance can omit. Consider adding a dashboard
    example from the Course Author's own material.
  purpose: A dashboard read at a glance, and what that glance can miss.
