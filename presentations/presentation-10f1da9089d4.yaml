- id: slide-8a6f556cc30d
  archived: false
  layout: bullets
  title: Expert vs. Novice Intuition
  bullets:
  - 'Intuition is not always poor: skilled performance is rapid and effortless after prolonged practice.'
  - Chess masters recognize patterns quickly, which is skill, not guessing.
  - Practice and feedback separate expert intuition from novice impressions.
  speaker_notes: 'Kahneman''s Nobel lecture gives the chess master example: the skill is acquired by prolonged
    practice, and its performance is rapid and effortless. Kahneman and Klein add that expertise develops
    in predictable environments where the judge can learn the regularities. Ask students which of their
    own intuitions come from that kind of practice.'
  purpose: How practice and feedback shape the reliability of intuitive judgment.
