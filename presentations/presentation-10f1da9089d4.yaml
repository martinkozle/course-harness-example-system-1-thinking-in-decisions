- id: slide-f9afac07d917
  archived: false
  layout: bullets
  title: Heuristics as Adaptive Shortcuts
  bullets:
  - Heuristics are efficient processes that ignore part of the available information.
  - Less information, computation, and time can sometimes improve accuracy.
  - Ecological rationality asks in which environments a given strategy succeeds or fails.
  speaker_notes: Gigerenzer and Brighton describe the mind as an adaptive toolbox. The key question is
    not whether a heuristic is biased, but whether it fits the environment. Their abstract argues a biased
    mind can handle uncertainty more efficiently and robustly than an unbiased, resource-intensive one.
  purpose: 'Fast-and-frugal view: shortcuts that often work well in real environments.'
  citations:
  - source_id: source-54f3cd9c1f33
    label: Gigerenzer & Brighton 2009, Homo heuristicus
    url: null
    line_start: null
    line_end: null
