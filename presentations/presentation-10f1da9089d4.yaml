- id: slide-7bbf4113f1f5
  archived: false
  layout: bullets
  title: System 1 Proposes, System 2 Tests
  bullets:
  - System 2 monitors the tentative judgments and intentions System 1 produces.
  - 'Most intuitive errors involve both systems: System 1 generates the error, System 2 fails to catch
    it.'
  - Hypothetical thinking is the deliberate check that can test a fast hypothesis.
  speaker_notes: 'Kahneman''s account assumes System 2 continuously monitors System 1''s tentative judgments.
    Errors therefore involve two failures: generation by System 1 and non-detection by System 2. In a
    decision model, the fast output is the hypothesis, and the model or analyst is the test.'
  purpose: How fast hypotheses feed deliberate checks in decision models.
