- id: slide-e4a1716b2d26
  archived: false
  layout: bullets
  title: Characteristics of System 1
  bullets:
  - Operations are implicit, not available to introspection, and often emotionally charged.
  - Governed by habit, so they are difficult to control or modify.
  - 'Concurrent-task test: effortful processes interfere with each other; effortless ones do not.'
  speaker_notes: 'The concurrent-task test is the practical way to classify a process: if adding a second
    task disrupts it, the process draws on the limited effort capacity that System 2 uses.'
  purpose: Automatic, associative, effortless, and hard to inspect.
  citations:
  - source_id: source-c4bd70e31d8d
    label: Kahneman 2003, A perspective on judgment and choice
    url: null
