- id: slide-c59981ecd523
  archived: false
  layout: bullets
  title: Why Decisions Are Made Fast
  bullets:
  - Decision makers face limits on time, information, and mental effort.
  - Dual-process accounts treat rapid autonomous processes as the default response.
  - Less information and less computation can sometimes improve accuracy.
  speaker_notes: Stress that fast judgment is the normal mode, not a failure. Evans and Stanovich describe
    rapid autonomous (Type 1) processes as yielding default responses unless higher-order reasoning intervenes.
    Gigerenzer and Brighton argue that less information, computation, and time can sometimes improve accuracy.
  purpose: Time, information, and effort limits that push decisions toward fast judgment.
