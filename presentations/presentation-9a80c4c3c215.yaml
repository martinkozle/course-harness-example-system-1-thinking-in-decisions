  layout: title
  title: Where Intuition Goes Wrong
  subtitle: Framing, loss aversion, automation bias, and how to check System 1
  speaker_notes: 'Lecture 3 moves from what intuition does well to the predictable ways it fails in decisions,
    and how models and structured review correct those failures. Frame it as a question: when should we
    trust a fast judgment, and what should we check before acting on it?'
  purpose: Introduce the lecture objectives.
