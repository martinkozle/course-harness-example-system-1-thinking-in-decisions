- id: slide-d16fb38defbe
  archived: false
  layout: bullets
  title: 'Case Study: With and Without Review'
  bullets:
  - Nine clinicians estimated outcomes for 100 patient abstracts, with or without a predictive rule
  - Estimates were similar with or without access to the rule
  - 'Clinicians overestimated operative mortality: 7.6% vs. the model''s 6.3%'
  - Clinicians trusted their own estimates over the predictive rule
  speaker_notes: 'Ivanov et al. (2000) gave clinicians a predictive rule for half the study. Access did
    not change their estimates, and they overestimated both mortality and prolonged ICU stay relative
    to the model (ICU stay: 28% vs. 25%). Ask what a structured review step would have needed to change
    in this process.'
  purpose: A model-driven decision compared with and without structured review.
  citations:
  - source_id: source-b2af78b9bd5e
    label: Ivanov et al. 2000, Clinicians vs. statistical model for CABG outcomes
    url: null
    line_start: 87
    line_end: 101
- id: slide-4e22c33c3a2a
  archived: false
  layout: bullets
  title: Designing Decision Systems
  bullets:
  - The same attribute can be highly accessible in one display but not in another
  - Build calibration into organisational systems, not only individual habits
  - Design options can mitigate automation bias in decision-support systems
  - Require a short check of key assumptions before acting on model output
  speaker_notes: Displays and workflows shape what System 1 notices. The check on key assumptions is a
    practical recommendation; the cited sources give design principles rather than this specific step.
  purpose: Defaults, displays, and friction that account for System 1.
