- id: slide-a2f258e17a41
  archived: false
  layout: closing
  title: Closing and Next Steps
  text: Before a consequential decision, check the base rate, record your confidence, and ask what would
    prove you wrong.
  speaker_notes: 'Recap the habits from this course. Base rates and outside views counter the tendency
    to focus on the specific case. Calibration checks compare stated confidence with outcomes over time,
    so overconfidence becomes visible (Egan, 2025). Kahneman (2003) explains why the System 2 check matters:
    System 1 errors often pass unexamined unless deliberate monitoring catches them. Ask students to name
    one decision from their own work that they would check this week, and which habit they would apply
    first. Note that the pre-mortem technique is widely recommended but not yet covered by an admitted
    source in this course; cite a primary source before using it as evidence.'
  purpose: Close the course and point to quizzes and further reading.
