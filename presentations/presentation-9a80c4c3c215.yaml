- id: slide-9ae56fa8dd27
  archived: false
  layout: bullets
  title: 'Decision Analysis: System 2 Check'
  bullets:
  - Intuition is trustworthy only where the environment is predictable and learnable
  - Expert athletes used base rates in sequential play, unlike single-question lab tasks
  - Test an intuitive pick with expected value and sensitivity analysis
  - Ask whether the choice flips when a key estimate moves within its plausible range
  speaker_notes: Kahneman and Klein set the boundary conditions for intuitive expertise. Link and Raab
    show intuition working when the environment is sequential and expert users have experience. Use expected
    value and sensitivity analysis as deliberate tests of the fast answer.
  purpose: Expected value and sensitivity analysis as deliberate tests.
  citations:
  - source_id: source-2ecd078c536a
    label: Kahneman & Klein 2009, Conditions for intuitive expertise
    url: null
    line_start: null
