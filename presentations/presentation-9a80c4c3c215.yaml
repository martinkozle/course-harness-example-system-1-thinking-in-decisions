- id: slide-e5508d481c49
  archived: false
  layout: bullets
  title: Debiasing Tools
  bullets:
  - 'Premortem: assume the project has failed, then list the reasons why'
  - Calibration training with feedback improves confidence over time
  - Very high incentives barely reduced four classic biases; none came close to debiasing
  - Motivation alone is not a debiasing tool; add structure to the process
  speaker_notes: 'The Enke et al. result is important: paying more does not fix judgment. Structured tools
    such as premortems and feedback-based calibration training change the process itself.'
  purpose: Pre-mortems, checklists, and consider-the-opposite.
  citations:
