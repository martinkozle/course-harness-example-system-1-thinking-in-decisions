- id: slide-a7f120ab896f
  archived: false
  layout: bullets
  title: Loss Aversion and Prospect Theory
  bullets:
  - Prospect theory's value function is kinked at a reference point and steeper for losses
  - Most people reject a 50/50 gamble to win $150 or lose $100
  - 'Endowment effect: selling prices often exceed buying prices by a factor of 2 or more'
  - Loss aversion also contributes to status-quo bias
  speaker_notes: Loss aversion means outcomes are evaluated relative to a reference point, with losses
    weighted more heavily than equal gains. The endowment effect and status-quo bias are the everyday
    consequences.
  purpose: Value judgments that depart from expected value.
  citations:
  - source_id: source-c4bd70e31d8d
    label: Kahneman 2003, A perspective on judgment and choice
    url: null
    line_start: 1381
    line_end: 1569
- id: slide-0dfc0943c2ea
  archived: false
  layout: bullets
  title: 'Risk Attitudes: Intuitive vs. Modeled Utility'
  bullets:
  - Intuition favors sure gains and accepts risk to avoid sure losses
  - The 50/50 gamble to win $150 or lose $100 has expected value +$25, yet most people reject it
  - An explicit utility model makes the reference point and value curvature visible
  - Test a model's utility assumptions against observed choices before trusting its verdict
  speaker_notes: Contrast what people choose with what expected value recommends. The gap is not random
    noise; it reflects the value function. A modeled utility makes the assumption explicit so it can be
    questioned.
  purpose: Comparing intuitive risk choices with explicit utility models.
  citations:
  - source_id: source-c4bd70e31d8d
    label: Kahneman 2003, A perspective on judgment and choice
    url: null
    line_start: 993
    line_end: 1569
- id: slide-993fc4675bfe
  archived: false
  layout: bullets
  title: Automation Bias
  bullets:
  - Automation bias produces omission and commission errors when decision aids are imperfect
  - It occurs in naive and expert users and is not prevented by training or instructions
  - Attention is central; it overlaps with complacency under multi-task load
  - Uncritical reliance on LLM advice could amplify human biases
  speaker_notes: Automation bias is over-trust in model output. The Parasuraman and Manzey review ties
    it to attention, so checking the model requires deliberate attention, not only more training. The
    Cheung et al. PNAS study shows the same risk with LLM advice on moral dilemmas.
  purpose: Over-trusting model outputs.
  citations:
  - source_id: source-e455455d862a
    label: Parasuraman & Manzey 2010, Complacency and bias in human use of automation
    url: null
    line_start: 12
    line_end: 12
  - source_id: source-42268f22cf38
    label: Cheung, Maier & Lieder 2025, LLMs show amplified cognitive biases in moral decision-making
    url: null
