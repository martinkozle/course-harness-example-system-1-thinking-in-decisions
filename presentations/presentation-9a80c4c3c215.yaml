- id: slide-514d9605b9aa
  archived: false
  layout: bullets
  title: Framing and Choice Architecture
  bullets:
  - Logically identical options can produce different choices depending on how they are described
  - '"200 saved" drew a majority for the sure program; "400 die" drew a majority for the gamble'
  - Certain outcomes are overweighted, so certain saving and certain deaths feel very different
  - 'Framing effects appear in experts too: 77% vs. 61% in orthopaedic vignettes'
  speaker_notes: Walk through the Asian disease problem. Programs A and A' describe the same outcomes
    in different words, yet preferences reversed. The Janssen vignette study shows the same kind of framing
    effect in practicing surgeons.
  purpose: How presentation changes choices with the same underlying options.
