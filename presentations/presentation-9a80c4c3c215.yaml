- id: slide-75dedd59d200
  archived: false
  layout: bullets
  title: Algorithm Aversion
  bullets:
  - Forecasters often chose a human over a statistical algorithm that predicted more accurately
  - After seeing the algorithm err, people lost confidence in it faster than in a human
  - Aversion persisted even among people who saw the algorithm outperform a human
  - Over-trust and under-trust both produce costly decisions
  speaker_notes: 'Dietvorst et al. show that people abandon algorithms after a visible error, even when
    the algorithm was better overall. Pair this with automation bias: the same model can be over-trusted
    or under-trusted depending on recent experience.'
  purpose: Under-trusting models after a visible error (Dietvorst et al.).
  citations:
  - source_id: source-ae81aaef05f9
    label: Dietvorst, Simmons & Massey 2015, Algorithm aversion
    url: null
    line_start: 1
    line_end: 6
- id: slide-fe276e359bc4
  archived: false
  layout: bullets
  title: Structured Elicitation
  bullets:
  - 'Calibrated means: if you say 80% sure, you are right about 80% of the time'
  - Overconfidence is rampant, in domains from surgery to strategy
  - Calibration is trainable through habit, feedback, and repetition
  - Subjective experience is not a reliable indicator of judgment accuracy
  speaker_notes: Have learners write a probability or range before seeing any model output, then compare
    with the outcome. This makes priors explicit and gives feedback on calibration.
  purpose: Priors, ranges, and calibration training.
  citations:
