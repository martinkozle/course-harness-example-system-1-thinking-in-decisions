- id: slide-a9ef4529181e
  archived: false
  layout: bullets
  title: 'Course Synthesis: A Decision-Audit Framework'
  bullets:
  - 'Framing: are the options described the same way across alternatives?'
  - 'Reference point: is the judgment shaped by losses or existing holdings?'
  - 'Environment: is it predictable, and has the judge received feedback?'
  - 'Model trust: is model output being over- or under-trusted?'
  - 'Before committing: elicit calibrated ranges, run a premortem, test sensitivity'
  speaker_notes: Use this as the one-page audit for the whole course. Framing and reference-point questions
    come from Kahneman (2003); predictability and feedback from Kahneman & Klein (2009); model trust from
    Dietvorst et al. (2015) and Parasuraman & Manzey (2010); pre-decision steps from Egan (2025) and Klein
    (2008).
  purpose: Combining the course into one audit checklist.
