id: course-6fc01f525c14
title: System 1 Thinking in Decisions
audience: Master's students in data science, decision models class
goals:
- Build the dual-process framework and show that intuition is useful and often necessary.
- Teach the main error patterns in judgment, with statistical grounding.
- Connect biases to decision models and practical debiasing.
outcomes:
- Explain the dual-process view of fast, intuitive (System 1) and slow, deliberate (System 2) thinking.
- Identify when intuition is reliable and when it produces systematic errors.
- Recognize common biases in data-driven decisions and apply model-based corrections.
