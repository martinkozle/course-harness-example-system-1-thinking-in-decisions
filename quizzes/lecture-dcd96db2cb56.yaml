- id: question-aa6ded08bf9f
  prompt: According to the heuristics-and-biases account, what does anchoring and adjustment imply about
    a numerical estimate that starts from an initial value?
  options:
  - id: option-91d34ff87de0
    text: The estimate is only influenced if the initial value is informative about the answer
    correct: false
    explanation: Anchoring occurs even with arbitrary information. Enke et al. (2021) note that arbitrary
      initial information can become an anchor for later decisions, with only partial adjustment (Tversky
      & Kahneman, 1974).
    citations: []
  - id: option-2a6562931ada
    text: The estimate moves fully to the correct value once the person has adjusted
    correct: false
    explanation: If adjustment were complete, anchoring would not produce systematic errors. Tversky &
      Kahneman (1974) describe the errors as arising because adjustment is typically insufficient.
    citations: []
  - id: option-d12dece80baf
    text: The estimate is more accurate when the anchor is random, because randomness cancels out
    correct: false
    explanation: Random anchors still bias estimates in the direction of the anchor. Enke et al. (2021)
      use random anchors in their experiment precisely to create an uninformative starting point that
      still influences answers.
    citations: []
  - id: option-84db0ff04a4b
    text: The estimate is pulled toward the initial value, and adjustment away from it is usually partial
    correct: true
    explanation: 'Tversky & Kahneman (1974) describe adjustment from an anchor as a heuristic that is
      economical and often effective, but which leads to systematic errors when the adjustment is insufficient.
      Enke et al. (2021) describe the same pattern: arbitrary information becomes a starting point, with
      only partial adjustment.'
    citations: []
  citations:
