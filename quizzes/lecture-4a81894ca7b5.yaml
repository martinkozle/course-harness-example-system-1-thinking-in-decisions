- id: question-398bfb750477
  prompt: Dietvorst, Simmons & Massey (2015) found that people avoid a statistical algorithm after seeing
    it make an error. What best explains this algorithm aversion?
  options:
  - id: option-09ae35223c73
    text: They lose confidence in the algorithm faster than in a human after both make the same mistake.
    correct: true
    explanation: null
    citations: []
  - id: option-28561f5e1a0d
    text: They reject any forecast that contains a visible error, whether it comes from a human or an
      algorithm.
    correct: false
    explanation: 'The study shows the asymmetry: after the same mistake, people lose confidence in the
      algorithm more quickly than in a human forecaster. Errors by humans do not produce the same loss
      of confidence.'
    citations: []
  - id: option-8b52c5cb3d3d
    text: They correctly learned that algorithms are less accurate than human forecasters.
    correct: false
    explanation: Algorithms were the more accurate forecasters in these studies. Participants avoided
      them even after seeing them outperform a human, so the avoidance was not based on accuracy.
    citations: []
  citations:
  - source_id: source-ae81aaef05f9
    label: Dietvorst, Simmons & Massey 2015, Algorithm aversion
    url: null
    line_start: 1
    line_end: 6
- id: question-745efbc050a2
  prompt: Which statement describes a well-calibrated judgment?
  options:
  - id: option-c321a71e37d0
    text: Your forecasts are usually correct, whatever confidence you state.
    correct: false
    explanation: Calibration is about how well stated confidence matches accuracy, not about accuracy
      alone. Egan (2025) says a well-calibrated thinker is not necessarily always right, and a high hit
      rate with low stated confidence is still miscalibrated.
    citations: []
  - id: option-d773ae5d252a
    text: You never state confidence below 90%, so you are never underconfident.
    correct: false
    explanation: Stating high confidence does not make a judgment calibrated. Egan (2025) defines calibration
      as aligning confidence with accuracy, so always stating 90% is overconfidence unless about 90% of
      those events happen.
    citations: []
  - id: option-346aca9ccce2
    text: Your average confidence matches the average confidence of other experts.
    correct: false
    explanation: Calibration is measured against outcomes, not against other people's confidence. Egan
      (2025) defines it as confidence aligning with accuracy.
    citations: []
  - id: option-35959bf4ff35
    text: Of the events you rate at 80%, about 80% occur.
    correct: true
    explanation: null
    citations: []
  citations:
  - source_id: source-0c230ae5775c
    label: 'Egan 2025, Stay calibrated: a practical guide to debiasing decision-making'
    url: null
    line_start: 1
