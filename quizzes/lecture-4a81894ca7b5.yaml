questions:
- id: question-16076fc71bfb
  prompt: Two versions of the Asian disease problem have the same outcomes. In one, a sure program saves
    200 of 600 people; in the other, 400 of 600 people die under the sure option. Why did preferences
    reverse?
  options:
  - id: option-601e63504cd9
    text: The reworded programs have different expected outcomes, so people correctly updated their choices.
    correct: false
    explanation: The two versions have no substantive difference in outcomes, as Kahneman (2003) notes.
      The reversal comes from the wording, not from a change in the numbers.
    citations: []
  - id: option-55f55d8bf2f1
    text: The same outcomes evoke different associations, so a sure gain is favored and a sure loss is
      avoided.
    correct: true
    explanation: null
    citations: []
  - id: option-637eaf500678
    text: Participants misread the probabilities in the second version, so they chose the gamble by mistake.
    correct: false
    explanation: The reversal is systematic across respondents and is not explained by misreading. Kahneman
      (2003) attributes it to different associations and evaluations evoked by the same outcomes.
    citations: []
  citations:
  - source_id: source-c4bd70e31d8d
    label: Kahneman 2003, A perspective on judgment and choice
    url: null
    line_start: 993
    line_end: 1010
- id: question-ec9a0d00f52d
  prompt: A 50/50 gamble wins $150 or loses $100. Its expected value is +$25, yet most people reject it.
    Which explanation fits prospect theory?
  options:
  - id: option-a39c9f97b6d3
    text: The gamble's expected value is negative, so rejecting it is the correct choice.
    correct: false
    explanation: The expected value is 0.5 × $150 + 0.5 × (−$100) = +$25, so the gamble is favorable on
      average. The rejection comes from the value function, not the arithmetic.
    citations: []
  - id: option-a8121c668656
    text: People ignore the probabilities and respond only to the largest possible outcome.
    correct: false
    explanation: Prospect theory does not say probabilities are ignored; it says losses weigh more heavily
      than equal gains. Most people reject the gamble unless the possible win is at least about twice
      the possible loss (Kahneman, 2003).
    citations: []
  - id: option-d423865a66b2
    text: Losses are weighed more heavily than equal gains, so the possible win must be about twice the
      possible loss.
    correct: true
    explanation: null
    citations: []
